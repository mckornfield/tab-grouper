<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Tab Grouper Settings</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 16px; width: 320px; }
    label { display: block; margin-top: 12px; font-size: 13px; color: #333; }
    input, textarea { width: 100%; box-sizing: border-box; padding: 6px; margin-top: 4px; font-family: inherit; }
    .hint { font-size: 11px; color: #777; margin-top: 2px; }
    button { margin-top: 16px; padding: 6px 12px; margin-right: 8px; }
    #status { margin-top: 8px; font-size: 12px; color: #2a2; }
    #testStatus { margin-top: 8px; font-size: 12px; }
    #testStatus.ok { color: #2a2; }
    #testStatus.err { color: #d33; }
    #testStatus.pending { color: #888; }
  </style>
</head>
<body>
  <h3>Tab Grouper Settings</h3>
  <label>
    Chat completions endpoint
    <input id="endpoint" type="text" />
  </label>
  <label>
    Model name
    <input id="model" type="text" />
  </label>
  <label>
    API key (optional, e.g. for NVIDIA endpoint)
    <input id="apiKey" type="password" />
  </label>
  <label>
    Categories (optional, comma-separated)
    <textarea id="categories" rows="2" placeholder="e.g. Code, Docs, AI, Shopping, Social"></textarea>
    <div class="hint">If set, the model is asked to prefer these categories (and close matches get snapped to them), but can still fall back to a different one for tabs that don't fit. Any tab matched to one of these always groups, even if only one tab matches. If left blank, the model picks freeform categories and only groups 2+ matching tabs.</div>
  </label>
  <button id="save">Save</button>
  <button id="test">Test connection</button>
  <div id="status"></div>
  <div id="testStatus"></div>
  <script src="options.js"></script>
</body>
</html>
